{% extends "users/base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="row">
    <div class="col-lg-6 mx-auto">
      <div class="card shadow">
        <div class="card-body text-center">
          <h4 class="card-title mb-3">Cancel Booking?</h4>
          <p>
            {{ booking.movie.name }} — {{ booking.theater.name }}<br>
            Date: {{ booking.theater.date }}<br>
            Seat: {{ booking.seat.seat_number }}<br>
            Booked at: {{ booking.booked_at|date:"F d, Y H:i" }}
          </p>
          <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">Yes, cancel it</button>
            <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Keep booking</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
