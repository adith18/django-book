{% extends "users/base.html" %}

{% block content %}
<style>
  .auth-wrapper {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .auth-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    padding: 48px 40px;
    text-align: center;
    max-width: 440px;
    width: 100%;
  }
  .auth-icon-circle {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  .auth-icon-circle i { color: #fff !important; font-size: 28px; }
  .auth-card h2 { font-weight: 800 !important; font-size: 1.5rem !important; margin-bottom: 10px !important; color: #1a1a2e !important; }
  .auth-card p { color: #777 !important; font-size: 0.95rem !important; margin-bottom: 0 !important; }
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-icon-circle"><i class="fas fa-envelope"></i></div>
    <h2>Reset link sent</h2>
    <p>Please check your email for the link to reset your password.</p>
  </div>
</div>
{% endblock %}
