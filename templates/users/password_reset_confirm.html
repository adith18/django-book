{% extends 'users/base.html' %}

{% block content %}
<style>
  .auth-wrapper {
    min-height: 65vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .auth-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    max-width: 440px;
    width: 100%;
    overflow: hidden;
  }
  .auth-header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff;
    text-align: center;
    padding: 32px 24px 24px;
  }
  .auth-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
  }
  .auth-icon i { color: #fff !important; font-size: 24px; }
  .auth-header h2 { font-weight: 800 !important; font-size: 1.3rem !important; margin: 0 !important; color: #fff !important; }
  .auth-body { padding: 28px; }
  .auth-body p, .auth-body label {
    color: #333 !important;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .auth-body input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .auth-body input:focus {
    outline: none;
    border-color: #1a1a2e;
  }
  .btn-auth-primary {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: none;
    color: #fff !important;
    font-weight: 700;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    margin-top: 10px;
    transition: opacity .15s;
  }
  .btn-auth-primary:hover { opacity: .9; }
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon"><i class="fas fa-key"></i></div>
      <h2>Change your password</h2>
    </div>
    <div class="auth-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-auth-primary">
          <i class="fas fa-key me-1"></i> Reset password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
