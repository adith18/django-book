{% extends "users/base.html" %}

{% block content %}
<style>
  .auth-wrapper {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .auth-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    max-width: 440px;
    width: 100%;
    overflow: hidden;
  }
  .auth-header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff;
    text-align: center;
    padding: 32px 24px 24px;
  }
  .auth-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
  }
  .auth-icon i { color: #fff !important; font-size: 24px; }
  .auth-header h2 { font-weight: 800 !important; font-size: 1.3rem !important; margin: 0 !important; color: #fff !important; }
  .auth-body { padding: 28px; }
  .auth-body label { font-size: 0.75rem; font-weight: 700; letter-spacing: .5px; color: #555 !important; display: block; margin-bottom: 4px; }
  .auth-body input {
    display: block;
    width: 100%;
    padding: 10px 12px;
    font-size: 0.95rem;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    margin-bottom: 4px;
  }
  .auth-body input:focus {
    outline: none;
    border-color: #1a1a2e;
    box-shadow: 0 0 0 3px rgba(26,26,46,0.1);
  }
  .auth-body .form-group { margin-bottom: 16px; }
  .btn-auth-primary {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: none;
    color: #fff !important;
    font-weight: 700;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    margin-top: 10px;
    transition: opacity .15s;
  }
  .btn-auth-primary:hover { opacity: .9; }
  .auth-footer { text-align: center; padding: 16px 24px 28px; font-size: 0.9rem; }
  .auth-footer a { color: #1a1a2e !important; font-weight: 700; text-decoration: none; }
  .auth-footer a:hover { text-decoration: underline; }
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon"><i class="fas fa-lock"></i></div>
      <h2>Set a new password</h2>
    </div>
    <div class="auth-body">
      <form method="POST" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.help_text %}
          <small class="form-text text-muted">{{ field.help_text }}</small>
          {% endif %}
          {% for error in field.errors %}
          <div class="invalid-feedback d-block">{{ error }}</div>
          {% endfor %}
        </div>
        {% endfor %}
        <button class="btn-auth-primary" type="submit">
          <i class="fas fa-key me-2"></i>Reset Password
        </button>
      </form>
    </div>
    <div class="auth-footer">
      <a href="{% url 'login' %}"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
